[platformio]
default_envs = voicepe
src_dir = main

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600

[env:voicepe]
board_build.cmake_extra_args = -DTATER_NATIVE_BUILD_ENV=voicepe -DTATER_USB_ETHERNET=ON
build_flags =
    -D TATER_NATIVE_PLATFORMIO_BUILD=1
    -D TATER_BOARD_VOICE_PE=1

[env:sat1]
board_build.cmake_extra_args = -DTATER_NATIVE_BUILD_ENV=sat1 -DTATER_USB_ETHERNET=ON
build_flags =
    -D TATER_NATIVE_PLATFORMIO_BUILD=1
    -D TATER_BOARD_VOICE_PE=0
    -D TATER_BOARD_SAT1=1

[env:respeaker_xvf3800]
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv
board_build.cmake_extra_args = -DTATER_NATIVE_BUILD_ENV=respeaker_xvf3800 -DTATER_USB_ETHERNET=ON
build_flags =
    -D TATER_NATIVE_PLATFORMIO_BUILD=1
    -D TATER_BOARD_VOICE_PE=0
    -D TATER_BOARD_SAT1=0
    -D TATER_BOARD_RESPEAKER_XVF3800=1

[env:s3_box]
board_build.cmake_extra_args = -DTATER_NATIVE_BUILD_ENV=s3_box -DTATER_USB_ETHERNET=ON
build_flags =
    -D TATER_NATIVE_PLATFORMIO_BUILD=1
    -D TATER_BOARD_VOICE_PE=0
    -D TATER_BOARD_SAT1=0
    -D TATER_BOARD_RESPEAKER_XVF3800=0
    -D TATER_BOARD_S3_BOX=1

# Compatibility aliases for development builds. Release images use the standard environments.
[env:sat1_usb_ethernet]
extends = env:sat1

[env:voicepe_usb_ethernet]
extends = env:voicepe

# Explicit XMOS integration variants; sat1 ships the IC-enabled pre-AEC beam.
[env:sat1_xmos_beam_ic]
extends = env:sat1
board_build.cmake_extra_args = ${env:sat1.board_build.cmake_extra_args} -DTATER_SAT1_XMOS_VARIANT=beam_ic

[env:sat1_xmos_legacy]
extends = env:sat1
board_build.cmake_extra_args = ${env:sat1.board_build.cmake_extra_args} -DTATER_SAT1_XMOS_VARIANT=legacy

[env:sat1_xmos_aec4]
extends = env:sat1
board_build.cmake_extra_args = ${env:sat1.board_build.cmake_extra_args} -DTATER_SAT1_XMOS_VARIANT=aec4

[env:sat1_xmos_aec4_beam]
extends = env:sat1
board_build.cmake_extra_args = ${env:sat1.board_build.cmake_extra_args} -DTATER_SAT1_XMOS_VARIANT=aec4_beam

# Lab-only USB capture images. Build/package XMOS with --bench first.

[env:sat1_audio_bench_beam_ic]
extends = env:sat1
board_build.cmake_extra_args = ${env:sat1.board_build.cmake_extra_args} -DTATER_SAT1_XMOS_VARIANT=beam_ic -DTATER_SAT1_AUDIO_BENCH=ON

[env:sat1_audio_bench_aec4]
extends = env:sat1
board_build.cmake_extra_args = ${env:sat1.board_build.cmake_extra_args} -DTATER_SAT1_XMOS_VARIANT=aec4 -DTATER_SAT1_AUDIO_BENCH=ON

[env:sat1_audio_bench_aec4_beam]
extends = env:sat1
board_build.cmake_extra_args = ${env:sat1.board_build.cmake_extra_args} -DTATER_SAT1_XMOS_VARIANT=aec4_beam -DTATER_SAT1_AUDIO_BENCH=ON

[env:sat1_audio_bench_legacy]
extends = env:sat1
board_build.cmake_extra_args = ${env:sat1.board_build.cmake_extra_args} -DTATER_SAT1_XMOS_VARIANT=legacy -DTATER_SAT1_AUDIO_BENCH=ON
