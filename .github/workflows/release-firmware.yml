name: Release Firmware

on:
  push:
    tags:
      - "native-*"

permissions:
  contents: write

concurrency:
  group: native-firmware-release
  cancel-in-progress: false

jobs:
  firmware:
    name: Build Native Firmware
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.platformio
      PLATFORMIO_VERSION: "6.1.19"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            .platformio
          key: platformio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini', 'dependencies.lock', 'main/idf_component.yml') }}
          restore-keys: |
            platformio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-

      - name: Install PlatformIO
        run: python -m pip install --upgrade pip "platformio==${PLATFORMIO_VERSION}"

      - name: Select release boards
        id: scope
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == native-satellite1-* ]]; then
            echo "board=satellite1" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == native-voicepe-* ]]; then
            echo "board=voicepe" >> "$GITHUB_OUTPUT"
          else
            echo "board=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Build firmware
        env:
          RELEASE_BOARD: ${{ steps.scope.outputs.board }}
        run: |
          if [ "$RELEASE_BOARD" = satellite1 ]; then
            platformio run -e sat1
          elif [ "$RELEASE_BOARD" = voicepe ]; then
            platformio run -e voicepe
          else
            platformio run -e voicepe -e sat1 -e respeaker_xvf3800 -e s3_box
          fi

      - name: Check out XMOS RTOS sources for host regressions
        uses: actions/checkout@v4
        with:
          repository: xmos/fwk_rtos
          ref: 6d5a6fb75f41d65e84e66e4467b898cd02080463
          path: main/boards/sat1/xmos/source/modules/rtos
          persist-credentials: false

      - name: Run host regressions
        env:
          IDF_PATH: ${{ github.workspace }}/.platformio/packages/framework-espidf
        run: |
          set -euo pipefail
          for test in main/scripts/test_*_host.sh; do
            bash "$test"
          done
          python -m unittest discover -s scripts/tests -p 'test_release_*.py'
          python main/tests/test_sat1_doa_ui_host.py

      - name: Package release assets
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BOARD: ${{ steps.scope.outputs.board }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          RELEASE_DIR="${RUNNER_TEMP}/tater-native-release"
          BASE_ARGS=()
          if [ "$RELEASE_BOARD" != all ]; then
            BASE_DIR="${RUNNER_TEMP}/tater-native-previous"
            mkdir -p "$BASE_DIR"
            gh release download --repo "$GITHUB_REPOSITORY" \
              --pattern latest.json --pattern '*-manifest.json' --dir "$BASE_DIR"
            BASE_MANIFEST="$(python -c 'import json,sys; from pathlib import PurePosixPath; from urllib.parse import urlparse; print(PurePosixPath(urlparse(json.load(open(sys.argv[1]))["manifest"]).path).name)' "$BASE_DIR/latest.json")"
            BASE_ARGS=(--previous-latest "$BASE_DIR/latest.json" --previous-manifest "$BASE_DIR/$BASE_MANIFEST")
          fi
          ./scripts/build_native_firmware_manifest.py \
            --board "$RELEASE_BOARD" \
            --skip-build \
            --release-repo "$GITHUB_REPOSITORY" \
            --release-tag "$TAG" \
            --release-dir "$RELEASE_DIR" \
            "${BASE_ARGS[@]}"

          VERSION="$(python -c 'import json; print(json.load(open("'"${RELEASE_DIR}"'/latest.json", encoding="utf-8"))["version"])')"
          DISPLAY_VERSION="$(python -c 'import json; data=json.load(open("'"${RELEASE_DIR}"'/latest.json", encoding="utf-8")); print(data.get("display_version") or data["version"])')"
          if [ "$TAG" != "$VERSION" ] && [[ "$TAG" != "${VERSION}-"* ]]; then
            echo "Tag ${TAG} does not match firmware version ${VERSION} or a suffixed follow-up release." >&2
            exit 1
          fi

          RELEASE_MANIFESTS=("${RELEASE_DIR}"/*-manifest.json)
          RELEASE_MANIFEST="${RELEASE_MANIFESTS[0]}"
          ./scripts/render_release_notes.py \
            "$RELEASE_MANIFEST" \
            "${RELEASE_DIR}/RELEASE_NOTES.md"

          {
            echo "version=${VERSION}"
            echo "display_version=${DISPLAY_VERSION}"
            echo "release_dir=${RELEASE_DIR}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tater-native-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.release_dir }}/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
          DISPLAY_VERSION: ${{ steps.package.outputs.display_version }}
          RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
          RELEASE_BOARD: ${{ steps.scope.outputs.board }}
        run: |
          set -euo pipefail
          TITLE="Tater Firmware ${DISPLAY_VERSION}"
          if [ "$RELEASE_BOARD" = satellite1 ]; then
            TITLE="Satellite1 Firmware ${DISPLAY_VERSION}"
          elif [ "$RELEASE_BOARD" = voicepe ]; then
            TITLE="Voice PE Firmware ${DISPLAY_VERSION}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${RELEASE_DIR}"/* --clobber
            gh release edit "$TAG" --latest --title "$TITLE" --notes-file "${RELEASE_DIR}/RELEASE_NOTES.md"
          else
            gh release create "$TAG" "${RELEASE_DIR}"/* --latest --verify-tag --title "$TITLE" --notes-file "${RELEASE_DIR}/RELEASE_NOTES.md"
          fi
